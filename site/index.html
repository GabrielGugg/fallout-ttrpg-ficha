<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b140d">
  <title>Ficha Fallout TTRPG 2.1</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-header">
    <button id="btn-voltar" class="header-btn" style="display:none" aria-label="Início">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>
    </button>
    <h1 id="header-titulo">Ficha Fallout 2.1</h1>
    <div id="header-acoes"></div>
  </header>

  <main id="app-content"></main>

  <footer id="rodape" class="no-print">
    <p>Projeto de fã para o <em>Fallout TTRPG 2.1</em> da Arcane Arcade, sem vínculo com a Bethesda. Adaptado do criador de fichas de ZaitBr-bit.</p>
  </footer>

  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-container" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="modal-titulo"></h2>
        <button class="modal-fechar" onclick="fecharModal()" aria-label="Fechar">&times;</button>
      </div>
      <div id="modal-corpo" class="modal-corpo"></div>
      <div id="modal-acoes" class="modal-acoes"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
